<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - CFHM Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .main {
            background-image: url('images/cfhm-logo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .main > * {
            position: relative;
            z-index: 1;
        }
        .form-card { 
            background-color: rgba(255,255,255,0.95);
        }
        .smooth-transition { transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div class="main hidden flex flex-col items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-2xl border border-gray-400 rounded-lg p-8 backdrop-blur-md shadow-2xl form-card">
            <div class="text-center mb-8">
                <img src="images/cfhm-logo.png" alt="CFHM Logo" class="h-16 w-auto mx-auto mb-4">
                <h2 class="font-bold text-4xl mb-2 text-gray-800">Create New User</h2>
                <p class="text-gray-600 text-sm">Register a new user for CFHM Management System</p>
            </div>

            <form id="userRegistrationForm" class="space-y-6">
                <!-- Personal Information Section -->
                <div class="pb-6 border-b-2 border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Personal Information</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="fullName" class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                            <input type="text" id="fullName" placeholder="John Doe" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" required>
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                            <input type="email" id="email" placeholder="john@example.com" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" required>
                        </div>
                        <div>
                            <label for="phone" class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
                            <input type="tel" id="phone" placeholder="+1-800-0000" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" required>
                        </div>
                        <div>
                            <label for="dateOfBirth" class="block text-sm font-semibold text-gray-700 mb-2">Date of Birth</label>
                            <input type="date" id="dateOfBirth" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" required>
                        </div>
                    </div>
                </div>

                <!-- Account Information Section -->
                <div class="pb-6 border-b-2 border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Account Information</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                            <input type="text" id="username" placeholder="johndoe" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" required>
                            <p id="usernameError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>
                        <div>
                            <label for="userRole" class="block text-sm font-semibold text-gray-700 mb-2">Role</label>
                            <select id="userRole" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" required>
                                <option value="">Select a role</option>
                                <option value="Administrator">Administrator</option>
                                <option value="Manager">Manager</option>
                                <option value="Member">Member</option>
                                <option value="Viewer">Viewer</option>
                            </select>
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                            <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" required>
                            <p class="text-gray-500 text-xs mt-1">Minimum 6 characters</p>
                        </div>
                        <div>
                            <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
                            <input type="password" id="confirmPassword" placeholder="••••••••" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" required>
                            <p id="passwordError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>
                    </div>
                </div>

                <!-- Contact & Address Section -->
                <div class="pb-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Contact & Address</h3>
                    <div class="space-y-4">
                        <div>
                            <label for="address" class="block text-sm font-semibold text-gray-700 mb-2">Street Address</label>
                            <input type="text" id="address" placeholder="123 Main Street" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <label for="city" class="block text-sm font-semibold text-gray-700 mb-2">City</label>
                                <input type="text" id="city" placeholder="New York" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                            </div>
                            <div>
                                <label for="state" class="block text-sm font-semibold text-gray-700 mb-2">State/Province</label>
                                <input type="text" id="state" placeholder="NY" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                            </div>
                            <div>
                                <label for="zipCode" class="block text-sm font-semibold text-gray-700 mb-2">Zip/Postal Code</label>
                                <input type="text" id="zipCode" placeholder="10001" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Permissions Section -->
                <div class="pb-6 border-b-2 border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Permissions</h3>
                    <div class="space-y-3">
                        <div class="flex items-center">
                            <input type="checkbox" id="perm-members" class="w-4 h-4 rounded cursor-pointer">
                            <label for="perm-members" class="ml-3 text-sm font-medium text-gray-700 cursor-pointer">Can manage members</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="perm-attendance" class="w-4 h-4 rounded cursor-pointer">
                            <label for="perm-attendance" class="ml-3 text-sm font-medium text-gray-700 cursor-pointer">Can view attendance</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="perm-dues" class="w-4 h-4 rounded cursor-pointer">
                            <label for="perm-dues" class="ml-3 text-sm font-medium text-gray-700 cursor-pointer">Can manage dues</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="perm-reports" class="w-4 h-4 rounded cursor-pointer">
                            <label for="perm-reports" class="ml-3 text-sm font-medium text-gray-700 cursor-pointer">Can generate reports</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="perm-users" class="w-4 h-4 rounded cursor-pointer">
                            <label for="perm-users" class="ml-3 text-sm font-medium text-gray-700 cursor-pointer">Can manage users</label>
                        </div>
                    </div>
                </div>

                <!-- Agreement Section -->
                <div class="pb-6">
                    <div class="flex items-start">
                        <input type="checkbox" id="agreeTerms" class="w-4 h-4 rounded cursor-pointer mt-1" required>
                        <label for="agreeTerms" class="ml-3 text-sm text-gray-700 cursor-pointer">
                            I agree to the <a href="#" class="text-blue-600 hover:underline">Terms of Service</a> and <a href="#" class="text-blue-600 hover:underline">Privacy Policy</a>
                        </label>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex gap-4 pt-6">
                    <button type="submit" class="flex-1 px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg font-semibold hover:from-blue-700 hover:to-purple-700 smooth-transition shadow-md">Create User</button>
                    <button type="reset" class="flex-1 px-6 py-3 bg-gray-400 text-white rounded-lg font-semibold hover:bg-gray-500 smooth-transition shadow-md">Clear Form</button>
                    <button type="button" onclick="goBack()" class="flex-1 px-6 py-3 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 smooth-transition shadow-md">Back</button>
                </div>
            </form>

            <!-- Success Message -->
            <div id="successMessage" class="hidden mt-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
                <p class="font-semibold">✓ User created successfully!</p>
                <p class="text-sm mt-1">The new user has been registered in the system.</p>
            </div>
        </div>
    </div>

    <!-- Toast messages -->
    <div id="toast" style="position:fixed; top:20px; right:20px; z-index:2000; display:none; padding:12px 18px; border-radius:8px; color:#fff; box-shadow:0 8px 18px rgba(2,6,23,0.2);"></div>

    <script>
        const form = document.getElementById('userRegistrationForm');
        const toast = document.getElementById('toast');
        const successMessage = document.getElementById('successMessage');
        const registrationSession = (() => {
            try {
                return JSON.parse(localStorage.getItem('loggedInUser') || 'null');
            } catch (error) {
                return null;
            }
        })();
        const registrationRole = String(registrationSession?.role || '').trim().toLowerCase();
        const canManageUsers = registrationRole === 'administrator' || registrationRole === 'admin' || registrationRole === 'manager';

        if (canManageUsers) {
            document.querySelector('.main').classList.remove('hidden');
        } else {
            window.location.replace(registrationSession ? 'index_clean.html' : 'login.html');
        }

        function showToast(message, bg, ms = 1200) {
            toast.textContent = message;
            toast.style.background = bg;
            toast.style.display = 'block';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.style.display = 'none', 300);
            }, ms);
        }

        function goBack() {
            window.location.href = 'index_clean.html';
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (!canManageUsers) {
                alert('Only Administrators and Managers can create users.');
                return;
            }

            // Get form values
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const dateOfBirth = document.getElementById('dateOfBirth').value;
            const username = document.getElementById('username').value.trim();
            const userRole = document.getElementById('userRole').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const address = document.getElementById('address').value.trim();
            const city = document.getElementById('city').value.trim();
            const state = document.getElementById('state').value.trim();
            const zipCode = document.getElementById('zipCode').value.trim();
            const agreeTerms = document.getElementById('agreeTerms').checked;

            // Validation
            if (!fullName || !email || !phone || !dateOfBirth || !username || !userRole || !password) {
                showToast('Please fill in all required fields', 'linear-gradient(90deg,#c62828,#8e0000)', 1800);
                return;
            }

            if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
                document.getElementById('passwordError').classList.remove('hidden');
                return;
            } else {
                document.getElementById('passwordError').classList.add('hidden');
            }

            if (password !== confirmPassword) {
                document.getElementById('passwordError').textContent = 'Passwords do not match';
                document.getElementById('passwordError').classList.remove('hidden');
                return;
            } else {
                document.getElementById('passwordError').classList.add('hidden');
            }

            if (!agreeTerms) {
                showToast('Please agree to the Terms of Service', 'linear-gradient(90deg,#c62828,#8e0000)', 1800);
                return;
            }

            // Collect permissions
            const permissions = {
                members: document.getElementById('perm-members').checked,
                attendance: document.getElementById('perm-attendance').checked,
                dues: document.getElementById('perm-dues').checked,
                reports: document.getElementById('perm-reports').checked,
                users: document.getElementById('perm-users').checked
            };

            // Create user object
            const newUser = {
                id: Date.now(),
                fullName,
                email,
                phone,
                dateOfBirth,
                username,
                role: userRole,
                password,
                address,
                city,
                state,
                zipCode,
                permissions,
                createdDate: new Date().toLocaleDateString(),
                status: 'Active'
            };

            // Save to localStorage
            const existingUsers = JSON.parse(localStorage.getItem('cfhmUsers') || '[]');
            
            // Check if username already exists
            if (existingUsers.some(u => u.username === username)) {
                document.getElementById('usernameError').textContent = 'This username is already taken';
                document.getElementById('usernameError').classList.remove('hidden');
                return;
            } else {
                document.getElementById('usernameError').classList.add('hidden');
            }

            existingUsers.push(newUser);
            localStorage.setItem('cfhmUsers', JSON.stringify(existingUsers));

            // Show success message
            form.style.display = 'none';
            successMessage.classList.remove('hidden');

            showToast('User created successfully!', 'linear-gradient(90deg,#2e7d32,#1b5e20)');

            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = 'index_clean.html';
            }, 2000);
        });

        // Real-time username availability check
        document.getElementById('username').addEventListener('change', function() {
            const username = this.value.trim();
            const existingUsers = JSON.parse(localStorage.getItem('cfhmUsers') || '[]');
            
            if (username && existingUsers.some(u => u.username === username)) {
                document.getElementById('usernameError').textContent = 'This username is already taken';
                document.getElementById('usernameError').classList.remove('hidden');
            } else {
                document.getElementById('usernameError').classList.add('hidden');
            }
        });

        // Real-time password match check
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (password && confirmPassword && password !== confirmPassword) {
                document.getElementById('passwordError').textContent = 'Passwords do not match';
                document.getElementById('passwordError').classList.remove('hidden');
            } else if (password && confirmPassword && password === confirmPassword) {
                document.getElementById('passwordError').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
